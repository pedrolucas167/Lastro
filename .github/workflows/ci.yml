name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Suite completa (inclui os testes @Tag("slow")) roda tambem toda madrugada.
  schedule:
    - cron: '0 6 * * *'

# Cancela execucoes antigas do mesmo PR/branch: economiza minutos de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Os testes de concorrencia/scale podem travar; limite duro.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # PRs: feedback rapido, sem os testes pesados (@Tag("slow")).
      - name: Build and test (fast)
        if: github.event_name == 'pull_request'
        run: ./mvnw -B -ntp verify

      # main e agendamento: suite completa, incluindo os testes de escala.
      - name: Build and test (full)
        if: github.event_name != 'pull_request'
        run: ./mvnw -B -ntp -Pall-tests verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
