name: Docker

# Valida que a imagem builda. Nao faz push (nao exige secrets).
# Quando houver credenciais de registry, adicione um job de push em tags.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'src/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'src/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: lastro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
