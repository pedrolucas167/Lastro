spring.application.name=Lastro
server.port=8080

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Metrics collection interval (default: 100ms)
lastro.metrics.interval-ms=100

# Market hours configuration (set lastro.market.enabled=false to bypass in tests)
lastro.market.enabled=true
lastro.market.open=10:00
lastro.market.close=18:00
lastro.market.weekend-trading-enabled=false

# Price bands (limit up / limit down): rejeita ordens fora de +/- percent do preco
# de referencia do simbolo. Simbolos sem referencia nao tem banda.
lastro.market.price-band.enabled=true
lastro.market.price-band.percent=10
lastro.market.price-band.reference-prices[PETR4]=30.50

# Load test defaults
lastro.loadtest.default-num-accounts=10
lastro.loadtest.default-num-transfers=1000
lastro.loadtest.default-concurrency=10
