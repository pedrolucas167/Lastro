spring.application.name=Lastro
server.port=8080

# Versao do projeto; o @..@ e filtrado pelo Maven no build (ver spring-boot-starter-parent).
lastro.version=@project.version@

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# O /actuator/health e publico (o HEALTHCHECK do container depende dele); com "always" os
# detalhes de banco/JVM iriam junto para quem nao esta autenticado.
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Metrics collection interval (default: 100ms)
lastro.metrics.interval-ms=100

# Market hours configuration (set lastro.market.enabled=false to bypass in tests)
lastro.market.enabled=true
lastro.market.open=10:00
lastro.market.close=18:00
lastro.market.weekend-trading-enabled=false

# Price bands (limit up / limit down): rejeita ordens fora de +/- percent do preco
# de referencia do simbolo. Simbolos sem referencia nao tem banda.
lastro.market.price-band.enabled=true
lastro.market.price-band.percent=10
lastro.market.price-band.reference-prices[PETR4]=30.50

# Autenticacao: a API valida JWT emitidos pelo Keycloak (realm lastro, ver deploy/keycloak/).
# jwk-set-uri e issuer-uri juntos: o JWKS e buscado sob demanda, mas o emissor e validado.
# A audiencia e o que diz para quem o token serve: o realm marca `lastro-api` no `aud` de todo
# token (escopo de cliente `lastro-api`). Sem ela, qualquer token do realm valeria na API.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/lastro
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/lastro/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=lastro-api

# Load test defaults
lastro.loadtest.default-num-accounts=10
lastro.loadtest.default-num-transfers=1000
lastro.loadtest.default-concurrency=10

# O load generator chama a propria API por HTTP, entao autentica como cliente M2M
# (client credentials). Credenciais do realm de desenvolvimento.
lastro.loadtest.token-uri=http://localhost:8090/realms/lastro/protocol/openid-connect/token
lastro.loadtest.client-id=lastro-service
lastro.loadtest.client-secret=lastro-service-secret

# Endurecimento do padrao dev: com o segredo de desenvolvimento em uso, um emissor
# nao-local derruba a subida -- o segredo esta no repositorio, entao contra um emissor
# publico ele e uma porta aberta. false troca o erro por um aviso de nivel WARN.
lastro.security.reject-dev-credentials=true
