spring.application.name=Lastro
server.port=8080

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Metrics collection interval (default: 100ms)
lastro.metrics.interval-ms=100

# Load test defaults
lastro.loadtest.default-num-accounts=10
lastro.loadtest.default-num-transfers=1000
lastro.loadtest.default-concurrency=10
